services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: workbench
      POSTGRES_USER: workbench
      POSTGRES_PASSWORD: workbench
    ports:
      - "5433:5432"
    volumes:
      - workbench-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workbench -d workbench"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: workbench
      MINIO_ROOT_PASSWORD: workbench-local-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - workbench-minio:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 workbench workbench-local-secret; do sleep 2; done;
      mc mb --ignore-existing local/factory-files"

volumes:
  workbench-postgres:
  workbench-minio:
